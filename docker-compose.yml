version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: borderlesspay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: borderlesspay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - borderlesspay-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderlesspay-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/borderlesspay
      JWT_SECRET: your-super-secret-jwt-key
      JWT_REFRESH_SECRET: your-super-secret-refresh-key
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      STELLAR_RPC_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK: TESTNET
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - borderlesspay-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: borderlesspay-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_STELLAR_NETWORK: TESTNET
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - borderlesspay-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: borderlesspay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - borderlesspay-network

volumes:
  postgres_data:
  redis_data:

networks:
  borderlesspay-network:
    driver: bridge
